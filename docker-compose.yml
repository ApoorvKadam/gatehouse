# The same single container the hosted preview runs: the FMS simulator on loopback, Gatehouse and its worker on :8000.
services:
  gatehouse:
    image: gatehouse:local
    build: .
    env_file: .env
    environment:
      DESK_DATABASE_URL: sqlite:////app/data/desk.db
      SIM_DATABASE_URL: sqlite:////app/data/fmssim.db
      DESK_FMS_BASE_URL: http://127.0.0.1:8100
    volumes:
      - data:/app/data
    ports:
      - "8000:8000"
    mem_limit: 512m
    memswap_limit: 512m

volumes:
  data:
